---
- name: Install via loop
  hosts: servers
  become: true

  vars:
    packages:
      - tree
      - curl

  tasks:
    - name: Update the package
      apt:
        update_cache: yes

    - name: Install package
      apt:
        name: "{{ item }}"
        state: present
      loop: "{{ packages }}"

    - name: Show completed tasks
      debug:
        msg: "Installing {{ item }}"
      loop: "{{ packages }}"

